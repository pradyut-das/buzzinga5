      <animate attributeName="opacity" values="1;1;0;0;0;0;1;1;0;0;1;1" keyTimes="0;0.30;0.32;0.34;0.36;0.38;0.40;0.62;0.64;0.72;0.74;1" dur="4s" repeatCount="indefinite"/>
    </g>
    <!-- state 2: top lids -->
    <g opacity="0">
      <path d="M32.5 50 A7.5 7.5 0 0 0 47.5 50 Z"/><path d="M52.5 50 A7.5 7.5 0 0 0 67.5 50 Z"/>
