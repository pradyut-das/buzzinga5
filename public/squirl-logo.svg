      <rect x="32.5" y="48" width="15" height="5"/><rect x="52.5" y="48" width="15" height="5"/>
      <animate attributeName="opacity" values="0;0;1;0;0;1;1;0;0" keyTimes="0;0.355;0.36;0.38;0.635;0.64;0.72;0.735;1" dur="4s" repeatCount="indefinite"/>
    </g>
  </g>
